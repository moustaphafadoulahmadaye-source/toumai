<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscription — Boutique Toumaï</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    display: flex;
    min-height: 100vh;
    background: #fff;
  }
  .login-split {
    display: flex;
    width: 100%;
    /* Flip order for registration to distinguish from login */
    flex-direction: row-reverse;
  }
  .login-image {
    flex: 1.2;
    display: none;
    background: url('images/hero.jpg') center/cover no-repeat;
    position: relative;
  }
  @media (min-width: 768px) {
    .login-image { display: block; }
  }
  .login-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 40%);
  }
  .login-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 40px;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }
  .login-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 60px;
  }
  .login-form-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 400px;
    margin: 0 auto;
    width: 100%;
  }
  .input-group {
    margin-bottom: 24px;
  }
  .input-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    color: #333;
  }
  .input-group input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .input-group input:focus {
    border-color: #000;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
  }
  .submit-btn {
    width: 100%;
    background: #000;
    color: #fff;
    border: none;
    padding: 16px;
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .submit-btn:hover {
    background: #222;
  }
  .submit-btn:active {
    transform: scale(0.98);
  }
  .social-btn {
    width: 100%;
    background: #fff;
    color: #333;
    border: 1px solid #ddd;
    padding: 14px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    transition: background 0.2s;
  }
  .social-btn:hover {
    background: #f9f9f9;
  }
  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 24px 0;
    color: #888;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #eaeaea;
  }
  .divider:not(:empty)::before {
    margin-right: .5em;
  }
  .divider:not(:empty)::after {
    margin-left: .5em;
  }

  @media (max-width: 600px) {
    .login-content {
      padding: 24px 18px calc(70px + env(safe-area-inset-bottom, 24px)) !important;
      min-height: 100vh !important;
      box-sizing: border-box !important;
    }
    .login-header {
      margin-bottom: 24px !important;
      gap: 12px !important;
    }
    .login-header a:first-child {
      margin-bottom: 0 !important;
    }
    .login-header a:first-child span:first-child {
      font-size: 1.2rem !important;
    }
    .login-header a:first-child span:last-child {
      font-size: 0.7rem !important;
    }
    .login-header a:last-child {
      padding: 6px 14px !important;
      font-size: 0.8rem !important;
      white-space: nowrap !important;
    }
    .login-form-container h1 {
      font-size: 1.6rem !important;
    }
    .login-form-container p {
      font-size: 0.9rem !important;
      margin-bottom: 20px !important;
    }
  }

</style>
  

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>


<div class="login-split">
  <!-- Right Side (in DOM, visually Right due to row-reverse): Image -->
  <div class="login-image">
    <div style="position: absolute; bottom: 40px; right: 40px; text-align: right; color: #fff; z-index: 10;">
      <h2 style="font-family: 'Outfit', sans-serif; font-size: 2.5rem; margin-bottom: 8px; font-weight: 600;">Rejoignez l'aventure.</h2>
      <p style="font-size: 1.1rem; opacity: 0.9; max-width: 400px; line-height: 1.5; margin-left: auto;">Créez votre compte aujourd'hui et profitez d'offres exclusives.</p>
    </div>
  </div>

  <!-- Left Side: Form -->
  <div class="login-content">
    <div class="login-header">
      <a href="index.html" style="display: flex; flex-direction: column; align-items: center; line-height: 1.1; text-decoration: none; margin-bottom: 24px;">
      <span style="font-size: 2rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; color: #000000;">BOUTIQUE TOUMAÏ</span>
      <span style="font-size: 1rem; font-weight: 800; color: #000000; letter-spacing: 0.05em; text-transform: uppercase;">ABNA HASSAN</span>
    </a>
      <a href="index.html" style="display: flex; align-items: center; gap: 8px; padding: 8px 20px; background: #fff; border: 1px solid #e0e0e0; border-radius: 99px; color: #000; text-decoration: none; font-size: 0.9rem; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: all 0.2s;" onmouseover="this.style.background='#f9f9f9'; this.style.boxShadow='0 4px 12px rgba(0,0,0,0.08)'; this.style.transform='translateX(-3px)';" onmouseout="this.style.background='#fff'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.04)'; this.style.transform='translateX(0)';">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Retour au site
      </a>
    </div>

    <div class="login-form-container">
      <h1 style="font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 700; color: #000; margin-bottom: 8px;">Créer un compte</h1>
      <p style="color: #666; font-size: 1rem; margin-bottom: 32px;">Rejoignez-nous pour une expérience d'achat inédite.</p>
      
<!-- Real Google Button Container -->
<div id="google-button-container" style="margin-bottom: 24px; display: flex; justify-content: center;"></div>

<div class="divider">ou connectez-vous avec un email</div>

      
      
      



      <form id="registerForm">
        <div class="input-group">
          <label for="name">Nom complet</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="input-group">
          <label for="email">Adresse email</label>
          <input type="email" id="email" placeholder="nom@exemple.com" required>
        </div>
        <div class="input-group">
          <label for="password">Mot de passe</label>
          <div style="position: relative;">
              <input type="password" id="password" placeholder="••••••••" required style="width:100%; padding-right:40px;">
              <button type="button" onclick="togglePassword('password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666; padding: 0; display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
        </div>
        <button type="submit" class="submit-btn">S'inscrire</button>
        <div id="msg" class="form-msg" style="margin-top: 16px; font-size: 0.9rem; text-align: center;"></div>
      </form>
      
      <p style="text-align: center; margin-top: 32px; font-size: 0.95rem; color: #666;">
        Vous avez déjà un compte ? <a href="login.html" style="color: #000; font-weight: 600; text-decoration: underline;">Connectez-vous</a>
      </p>
    </div>
  </div>
</div>

<script>
  window.addEventListener('load', async () => {
    try {
      const res = await fetch('/api/config');
      const { googleClientId } = await res.json();
      if (googleClientId && window.google) {
        google.accounts.id.initialize({
          client_id: googleClientId,
          callback: handleGoogleLogin
        });
        const container = document.getElementById("google-button-container");
        google.accounts.id.renderButton(
          container,
          { theme: "outline", size: "large", text: "continue_with", width: 320 }
        );
      }
    } catch(err) { console.error('Failed to init Google Auth:', err); }
  });

  async function handleGoogleLogin(response) {
    const msg = document.getElementById('msg');
    msg.textContent = "Inscription Google en cours...";
    msg.style.color = "#666";
    try {
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: response.credential })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur serveur');

      localStorage.setItem('kolo_token', data.token);
      localStorage.setItem('kolo_user', JSON.stringify(data.user));

      msg.textContent = "Inscription réussie ! Redirection...";
      msg.style.color = "#10b981";
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    } catch(err) {
      msg.textContent = err.message;
      msg.style.color = "#ef4444";
    }
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const submitBtn = document.querySelector('.submit-btn');
    
    msg.textContent = "Inscription en cours...";
    msg.style.color = "#666";
    submitBtn.textContent = "Patientez...";
    submitBtn.style.opacity = "0.7";

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur serveur');

      localStorage.setItem('kolo_token', data.token);
      localStorage.setItem('kolo_user', JSON.stringify(data.user));

      msg.textContent = "Inscription réussie ! Redirection...";
      msg.style.color = "#10b981"; // success green
      submitBtn.textContent = "Succès";
      submitBtn.style.background = "#10b981";

      setTimeout(() => {
        if (data.user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }
      }, 1000);
    } catch(err) {
      msg.textContent = err.message;
      msg.style.color = "#ef4444"; // error red
      submitBtn.textContent = "S'inscrire";
      submitBtn.style.opacity = "1";
    }
  });
</script>

<script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
  }
}
</script>
</body>
</html>
