<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réinitialisation — Boutique Toumaï</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: flex; min-height: 100vh; background: #fafafa; font-family: 'Inter', sans-serif; }
  .container { max-width: 480px; width: 100%; margin: auto; padding: 40px; background: #fff; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
  h1 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 700; margin-bottom: 8px; letter-spacing:-0.02em; }
  .input-group { margin-bottom: 24px; }
  .input-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.95rem; }
  .input-group input { width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; }
  .submit-btn { width: 100%; background: #000; color: #fff; padding: 16px; border: none; border-radius: 12px; font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: 0.2s; }
  .submit-btn:hover { background: #222; }
  #msg { text-align: center; margin-top: 16px; font-weight: 500; font-size: 0.95rem; }
</style>
</head>
<body>


<div class="container">
  <div style="text-align:center; margin-bottom: 32px;">
    <a href="index.html" style="display: flex; flex-direction: column; align-items: center; line-height: 1.1; text-decoration: none; margin-bottom: 24px;">
      <span style="font-size: 2rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; color: #000000;">BOUTIQUE TOUMAÏ</span>
      <span style="font-size: 1rem; font-weight: 800; color: #000000; letter-spacing: 0.05em; text-transform: uppercase;">ABNA HASSAN</span>
    </a>
  </div>
  
  <h1>Nouveau mot de passe</h1>
  <p style="color: #666; margin-bottom: 32px; line-height: 1.5;">Veuillez choisir un nouveau mot de passe sécurisé (minimum 8 caractères).</p>

  <form id="resetForm">
    <div class="input-group">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" required minlength="8" placeholder="••••••••">
    </div>
    <div class="input-group">
      <label for="confirm">Confirmez le mot de passe</label>
      <input type="password" id="confirm" required minlength="8" placeholder="••••••••">
    </div>
    <button type="submit" class="submit-btn">Réinitialiser</button>
    <div id="msg"></div>
  </form>
</div>

<script>
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const msg = document.getElementById('msg');
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      msg.textContent = 'Lien de réinitialisation invalide ou manquant.';
      msg.style.color = '#ef4444';
      return;
    }

    if (password !== confirm) {
      msg.textContent = 'Les mots de passe ne correspondent pas.';
      msg.style.color = '#ef4444';
      return;
    }

    const btn = document.querySelector('.submit-btn');
    btn.textContent = 'Patientez...';
    btn.style.opacity = '0.7';
    msg.textContent = '';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur serveur');

      msg.textContent = 'Mot de passe mis à jour avec succès !';
      msg.style.color = '#10b981';
      btn.style.display = 'none';
      
      setTimeout(() => window.location.href = 'login.html', 2000);
    } catch(err) {
      msg.textContent = err.message;
      msg.style.color = '#ef4444';
      btn.textContent = 'Réinitialiser';
      btn.style.opacity = '1';
    }
  });
</script>
</body>
</html>
